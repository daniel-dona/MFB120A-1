# ─── Arroz Rapido ──────────────────────────────────────
- name: "Arroz Rapido"
  next: "Mantener Caliente"
  stages:
    - type: heat
      to: 60
      hysteresis: 2
      power: max
    - type: hold
      to: 60
      hysteresis: 5
      duration: 300s
      power: high
    - type: heat
      to: 100
      hysteresis: 2
      bottom_threshold: 84
      power: max
    - type: hold
      to: 100
      hysteresis: 2
      duration: 600s
      power: medium
    - type: hold
      to: 105
      hysteresis: 5
      duration: 300s
      power: low
