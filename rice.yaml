esphome:
  name: rice-cooker

external_components:
  source:
    type: local
    path: components

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y
    advanced:
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_pin3

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}
    password: !secret wifi_password
  on_connect:
    - lambda:
        id(ricecooker_1).set_wifi(true);
  on_disconnect:
    - lambda:
        id(ricecooker_1).set_wifi(false);

captive_portal:

uart:
  - id: uart_bus
    tx_pin: GPIO33
    rx_pin: GPIO32
    baud_rate: 9600

ricecooker:
  id: ricecooker_1
  uart_id: uart_bus
  keep_warm_temperature: 65
  keep_warm_hysteresis: 5

  programs:
    # ─── Mantener caliente ─────────────────────────────────
    # Infinite hold at 65°C until cancelled
    - name: "Mantener Caliente"
      stages:
        - target_temperature: 65
          hysteresis: 5
          hold: true

    # ─── Arroz ──────────────────────────────────────────────
    # Full rice cooking cycle: soak → heat → cook → rest → keep warm
    - name: "Arroz"
      keep_warm_after: true
      stages:
        - target_temperature: 60
          hysteresis: 0        # Reach 60°C, then advance
        - target_temperature: 65
          hysteresis: 5
          duration: 45min      # Soak
        - target_temperature: 95
          hysteresis: 2        # Heat until 95°C
        - target_temperature: 100
          hysteresis: 1
          duration: 8min       # Cook first half
        - target_temperature: 100
          hysteresis: 0
          duration: 7min       # Cook second half (vapor phase)
        - target_temperature: 65
          hysteresis: 4
          duration: 10min      # Rest

    # ─── Arroz Rápido ──────────────────────────────────────
    # Quick rice: heat → cook → rest → keep warm
    - name: "Arroz Rapido"
      keep_warm_after: true
      stages:
        - target_temperature: 60
          hysteresis: 0
        - target_temperature: 95
          hysteresis: 2
        - target_temperature: 100
          hysteresis: 1
          duration: 15min
        - target_temperature: 65
          hysteresis: 4
          duration: 10min

    # ─── Cebolla Caramelizada ───────────────────────────────
    # Low and slow: sweat → caramelize → finish → keep warm
    - name: "Cebolla Caramelizada"
      keep_warm_after: true
      stages:
        - target_temperature: 80
          hysteresis: 3        # Sweat the onions
        - target_temperature: 88
          hysteresis: 3
          duration: 40min      # Caramelize
        - target_temperature: 75
          hysteresis: 2
          duration: 15min      # Deep flavor

    # ─── Cocción Lenta ──────────────────────────────────────
    # Generic slow cooker: configurable temperature and duration
    - name: "Coccion Lenta"
      keep_warm_after: true
      stages:
        - target_temperature: 90
          hysteresis: 3
          duration: 120min

    # ─── Yogur ──────────────────────────────────────────────
    # Gentle fermentation at 43°C for 8 hours, no keep warm after
    - name: "Yogur"
      keep_warm_after: false
      stages:
        - target_temperature: 43
          hysteresis: 2
          duration: 8h

sensor:
  - platform: ricecooker
    ricecooker_id: ricecooker_1
    top_temperature:
      name: "Sensor top"
    bottom_temperature:
      name: "Sensor bottom"

switch:
  - platform: ricecooker
    ricecooker_id: ricecooker_1
    power:
      name: "Power"

select:
  - platform: ricecooker
    ricecooker_id: ricecooker_1
    program:
      name: "Modo"

button:
  - platform: template
    name: "Start"
    on_press:
      - lambda:
          id(ricecooker_1).start();

  - platform: template
    name: "Cancel"
    on_press:
      - lambda:
          id(ricecooker_1).cancel();