esphome:
  name: rice-cooker

substitutions:
  name: rice-cooker

external_components:
  source:
    type: local
    path: components

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y
    advanced:
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true

logger:
  level: INFO
  hardware_uart: UART0
  baud_rate: 0
  logs:
    ricecooker_program: INFO
    ricecooker: INFO
    ricecooker_heater: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_pin3

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: ${name}
    password: !secret wifi_password
  on_connect:
    - lambda:
        id(ricecooker_1).set_wifi(true);
  on_disconnect:
    - lambda:
        id(ricecooker_1).set_wifi(false);

captive_portal:

uart:
  - id: uart_bus
    tx_pin: GPIO33
    rx_pin: GPIO32
    baud_rate: 9600

# ============================================================================
# Rice cooker component with YAML-defined cooking programs.
#
# Stage types:
#   - transitional: advance when bottom temp reaches target (no duration/hold)
#   - timed hold:    maintain temp for duration, then advance
#   - infinite hold: maintain temp until cancelled (type: keep)
#   - ramp:          interpolate from→to over duration
#
# Keep warm is explicit: define a program with a 'keep' stage and chain to it
# via 'next: "Mantener Caliente"' on any program that should maintain temp after.
#
# State machine:
#   - Idle:     no program selected, ready to start
#   - Running:  a program is actively running
#   - Finished: a program completed naturally (no next), stays until user acts
#
# Safety (always active, built-in):
#   - Emergency shutoff if plate > 130°C (any mode)
#   - Emergency shutoff if plate > 104°C during hold/keep
#   - Emergency shutoff if lid > 84°C during hold/keep
# ============================================================================

ricecooker:
  id: ricecooker_1
  uart_id: uart_bus
  can_start_sensor: can_start
  can_cancel_sensor: can_cancel
  state_sensor: state_sensor
  # can_select_sensor: can_select  TODO: add to codegen if needed

  programs:
    # ─── Mantener Caliente ─────────────────────────────────
    - name: "Mantener Caliente"
      description: "Mantiene la comida a temperatura de servicio"
      stages:
        - type: keep
          to: 40
          hysteresis: 4
          power: 20

    # ─── Arroz ──────────────────────────────────────────────
    - name: "Arroz"
      description: "Arroz blanco, 2 tazas de agua por 1 de arroz"
      next: "Mantener Caliente"
      stages:
        - type: hold
          to: 25
          hysteresis: 3
          duration: 32s
          power: off
        - type: hold
          to: 45
          hysteresis: 2
          duration: 180s
          power: max
        - type: hold
          to: 60
          hysteresis: 3
          duration: 2400s
          bottom_threshold: 130
          power: max
        - type: heat
          to: 100
          hysteresis: 2
          bottom_threshold: 73
          power: medium
        - type: heat
          to: 100
          hysteresis: 2
          bottom_threshold: 82
          power: high
        - type: heat
          to: 100
          hysteresis: 2
          bottom_threshold: 84
          power: high
        - type: heat
          to: 135
          hysteresis: 3
          bottom_threshold: 130
          power: high
        - type: hold
          to: 120
          hysteresis: 5
          duration: 300s
          power: medium
        - type: hold
          to: 125
          hysteresis: 5
          duration: 1800s
          bottom_threshold: 130
          power: medium
        - type: hold
          to: 105
          hysteresis: 5
          duration: 120s
          power: low

    # ─── Arroz Integral ────────────────────────────────────
    - name: "Arroz Integral"
      next: "Mantener Caliente"
      stages:
        - type: hold
          to: 25
          hysteresis: 3
          duration: 32s
          power: off
        - type: hold
          to: 60
          hysteresis: 5
          duration: 1800s
          bottom_threshold: 130
          power: max
        - type: heat
          to: 100
          hysteresis: 3
          bottom_threshold: 73
          power: medium
        - type: heat
          to: 100
          hysteresis: 3
          bottom_threshold: 75
          power: medium
        - type: heat
          to: 100
          hysteresis: 3
          bottom_threshold: 80
          power: medium
        - type: heat
          to: 128
          hysteresis: 3
          bottom_threshold: 130
          power: high
        - type: hold
          to: 128
          hysteresis: 5
          duration: 1800s
          power: low
        - type: hold
          to: 125
          hysteresis: 5
          duration: 900s
          power: low

    # ─── Arroz Rapido ──────────────────────────────────────
    - name: "Arroz Rapido"
      next: "Mantener Caliente"
      stages:
        - type: heat
          to: 60
          hysteresis: 2
          power: max
        - type: hold
          to: 60
          hysteresis: 5
          duration: 300s
          power: high
        - type: heat
          to: 100
          hysteresis: 2
          bottom_threshold: 84
          power: max
        - type: hold
          to: 100
          hysteresis: 2
          duration: 600s
          power: medium
        - type: hold
          to: 105
          hysteresis: 5
          duration: 300s
          power: low

    # ─── Cebolla Caramelizada ───────────────────────────────
    - name: "Cebolla Caramelizada"
      description: "Cebolla caramelizada con pausas para remover"
      stages:
        - type: heat
          to: 120
          hysteresis: 3
          power: high
        - type: hold
          to: 110
          hysteresis: 3
          duration: 60min
          power: high
        - type: action
          description: "Remueve la cebolla"
          to: 110
          hysteresis: 5
          power: off
        - type: hold
          to: 110
          hysteresis: 3
          duration: 60min
          power: medium
        - type: action
          description: "Remueve la cebolla"
          to: 110
          hysteresis: 5
          power: off
        - type: hold
          to: 110
          hysteresis: 3
          duration: 60min
          power: low

    # ─── Reducción ──────────────────────────────────────
    - name: "Reducir 4h"
      next: "Mantener Caliente"
      stages:
        - type: hold
          to: 105
          hysteresis: 5
          duration: 240min
          power: high

    - name: "Reducir 2h"
      next: "Mantener Caliente"
      stages:
        - type: hold
          to: 105
          hysteresis: 5
          duration: 120min
          power: high

    - name: "Reducir 1h"
      next: "Mantener Caliente"
      stages:
        - type: hold
          to: 105
          hysteresis: 5
          duration: 120min
          power: high

    # ─── Yogur ──────────────────────────────────────────────
    - name: "Yogur"
      stages:
        - type: hold
          to: 43
          hysteresis: 2
          duration: 8h
          power: gentle

    # ─── Recalentar ─────────────────────────────────────────
    - name: "Recalentar"
      next: "Mantener Caliente"
      stages:
        - type: hold
          to: 75
          hysteresis: 4
          duration: 15min
          power: medium

    # ─── Al Vapor ──────────────────────────────────────────
    - name: "Al Vapor"
      next: "Mantener Caliente"
      stages:
        - type: heat
          to: 100
          hysteresis: 3
          bottom_threshold: 89
          power: max
        - type: hold
          to: 100
          hysteresis: 2
          duration: 30min
          power: high
        - type: hold
          to: 85
          hysteresis: 5
          duration: 5min
          power: low

    # ─── Congee ────────────────────────────────────────────
    - name: "Congee"
      next: "Mantener Caliente"
      stages:
        - type: hold
          to: 60
          hysteresis: 5
          duration: 300s
          bottom_threshold: 130
          power: max
        - type: hold
          to: 80
          hysteresis: 3
          duration: 1800s
          bottom_threshold: 87
          power: high
        - type: hold
          to: 100
          hysteresis: 3
          duration: 3600s
          bottom_threshold: 130
          power: high
        - type: hold
          to: 90
          hysteresis: 3
          duration: 900s
          power: gentle

    # ─── Demo ────────────────────────────────────────────
    - name: "Test Completo"
      description: "Prueba heat, hold, ramp. Encadena con Mantener Caliente"
      next: "Mantener Caliente"
      stages:
        - type: heat          # TRANSITIONAL: avanza al alcanzar temp
          to: 40
          hysteresis: 3
          power: medium
        - type: hold          # TIMED_HOLD: mantiene temp por tiempo fijo
          to: 40
          hysteresis: 3
          duration: 300s
          power: medium
        - type: ramp          # RAMP: interpola de 60 a 80 en 30s
          from: 40
          to: 50
          hysteresis: 3
          duration: 600s
          curve: linear
          power: medium
        - type: ramp          # RAMP: interpola de 60 a 80 en 30s
          from: 50
          to: 40
          hysteresis: 3
          duration: 600s
          curve: linear
          power: medium
        - type: hold          # TIMED_HOLD: mantiene 80°C por 30s
          to: 40
          hysteresis: 3
          duration: 300s
          power: low

# ============================================================================
# Entities
# ============================================================================

sensor:
  - platform: ricecooker
    ricecooker_id: ricecooker_1
    top_temperature:
      name: "Tapa"
      filters:
        - throttle: 2s
    bottom_temperature:
      name: "Base"
      filters:
        - throttle: 2s
    voltage:
      name: "Tension"
      filters:
        - throttle: 60s
    remaining_time:
      name: "Tiempo total restante"
      filters:
        - throttle: 5s
    stage_remaining_time:
      name: "Tiempo fase restante"
      filters:
        - throttle: 5s
  - platform: template
    name: "Fase actual"
    id: stage_index
    update_interval: 2s
    lambda: |-
      return id(ricecooker_1).current_stage_index();
  - platform: template
    name: "Total fases"
    id: total_stages
    update_interval: 2s
    lambda: |-
      return id(ricecooker_1).total_stages();
  - platform: template
    name: "Objetivo fase"
    id: stage_target
    unit_of_measurement: "°C"
    update_interval: 2s
    lambda: |-
      return id(ricecooker_1).current_stage_target();

binary_sensor:
  - platform: template
    name: "Calentando"
    device_class: heat
    lambda: |-
      return id(ricecooker_1).get_power();

  - platform: template
    name: "Puede Iniciar"
    id: can_start
    lambda: |-
      return id(ricecooker_1).can_start();

  - platform: template
    name: "Puede Cancelar"
    id: can_cancel
    lambda: |-
      return id(ricecooker_1).can_cancel();

  - platform: template
    name: "Puede Confirmar"
    id: can_confirm
    lambda: |-
      return id(ricecooker_1).can_confirm();

  - platform: template
    name: "Puede Seleccionar"
    id: can_select
    lambda: |-
      return id(ricecooker_1).can_select_program();

select:
  - platform: ricecooker
    ricecooker_id: ricecooker_1
    name: "Programa"

text_sensor:
  - platform: template
    name: "Estado"
    id: state_sensor
    update_interval: 2s
    lambda: |-
      return std::string(id(ricecooker_1).get_state_name());
  - platform: template
    name: "Fase"
    id: stage_type
    update_interval: 2s
    lambda: |-
      return std::string(id(ricecooker_1).current_stage_type_name());
  - platform: template
    name: "Descripcion fase"
    id: stage_desc
    update_interval: 2s
    lambda: |-
      return std::string(id(ricecooker_1).current_stage_description());
  - platform: template
    name: "Descripcion programa"
    id: program_desc
    update_interval: 2s
    lambda: |-
      return std::string(id(ricecooker_1).current_program_description());

button:
  - platform: template
    name: "Iniciar"
    on_press:
      - lambda:
          id(ricecooker_1).start();

  - platform: template
    name: "Cancelar"
    on_press:
      - lambda:
          id(ricecooker_1).cancel();

  - platform: template
    name: "Confirmar"
    on_press:
      - lambda:
          id(ricecooker_1).confirm();
