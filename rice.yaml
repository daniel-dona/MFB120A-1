esphome:
  name: rice-cooker

external_components:
  source:
    type: local
    path: components

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y
    advanced:
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true

# Make sure logging is not using the serial port
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_pin3

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${name}
    password: !secret wifi_password

  on_connect:
    - lambda:
        id(ricecooker_1).set_wifi(true);
  on_disconnect:
    - lambda:
        id(ricecooker_1).set_wifi(false);

captive_portal:

uart:
  - id: uart_bus
    tx_pin: GPIO33
    rx_pin: GPIO32
    baud_rate: 9600

ricecooker:
  id: ricecooker_1
  uart_id: uart_bus
  keep_warm_temperature: 65
  keep_warm_hysteresis: 5
  rice_cooking_time: 15

sensor:
  - platform: ricecooker
    ricecooker_id: ricecooker_1
    top_temperature:
      name: "Sensor top"
    bottom_temperature:
      name: "Sensor bottom"

switch:
  - platform: ricecooker
    ricecooker_id: ricecooker_1
    power:
      name: "Power"

select:
  - platform: ricecooker
    ricecooker_id: ricecooker_1
    program:
      name: "Mode Select"

button:
  - platform: template
    name: "Start"
    on_press:
      - lambda:
          id(ricecooker_1).start();

  - platform: template
    name: "Cancel"
    on_press:
      - lambda:
          id(ricecooker_1).cancel();